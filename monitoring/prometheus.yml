global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (métriques système)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['172.26.0.2:9100']
        labels:
          instance: 'node-exporter'

  # Backend FastAPI (si vous ajoutez les métriques)
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
